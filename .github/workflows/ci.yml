name: PayG checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  health-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health-insurance/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: health-insurance/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  health-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health-insurance/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: health-insurance/backend/package-lock.json
      - run: npm ci
      - run: npm test
